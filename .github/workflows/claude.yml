# Claude baut nach dem Bauauftrag: startet, wenn ein Issue oder Kommentar @claude erwähnt.
# Braucht das Secret ANTHROPIC_API_KEY (in der Organisation hinterlegt) und die installierte Claude-GitHub-App.
name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(npm ci),Bash(npm install *),Bash(npm run *),Bash(npx *),Bash(git *),Bash(ls *),Bash(cat *),Edit,Write,Read,Glob,Grep"
