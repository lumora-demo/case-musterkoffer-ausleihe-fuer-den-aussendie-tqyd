# Baut die App bei jedem Stand auf main und stellt sie auf GitHub Pages bereit (Live-Vorschau).
name: Live-Vorschau
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bauen:
    # Nicht beim ersten Stand aus der Vorlage: da ist die Vorschau noch nicht eingeschaltet (Kompass macht das gleich danach)
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Initial commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  bereitstellen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
